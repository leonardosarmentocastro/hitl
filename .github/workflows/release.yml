name: release

# A release, in one run. On every push to main (and on demand): the prepare job decides from
# the merged pull requests whether a release is due (scripts/release.mjs prepare) and, if so,
# runs the gates and commits the version bump and the changelog section. The publish job
# follows, also when prepare failed or refused: it tags the version this run released (else
# the version on main) on the commit that set it, and creates its GitHub Release from its
# changelog section; it does nothing when both exist. Only when it tagged a version this run
# did not release (a backfill) does it start release again, to catch up what that held back.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      released: ${{ steps.commit.outputs.released }}
      version: ${{ steps.commit.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Identify as the Actions bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: List merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --state merged --base main --limit 100 --search "sort:updated-desc" \
            --json number,title,headRefName,mergeCommit > "$RUNNER_TEMP/prs.json"
      - name: Prepare the release
        id: prepare
        run: |
          node scripts/release.mjs prepare --repo . --prs "$RUNNER_TEMP/prs.json" | tee "$RUNNER_TEMP/prepare.json"
          released=$(jq -r .released "$RUNNER_TEMP/prepare.json")
          case "$released" in
            true | false) ;;
            *) echo "::error::release.mjs prepare printed no released flag (got '$released')"; exit 1 ;;
          esac
          echo "released=$released" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version // empty' "$RUNNER_TEMP/prepare.json")" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        if: steps.prepare.outputs.released == 'true'
      - name: Run the gates
        if: steps.prepare.outputs.released == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm format:check
      - name: Commit and push the release
        id: commit
        if: steps.prepare.outputs.released == 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git add CHANGELOG.md .claude-plugin/plugin.json .claude-plugin/marketplace.json .hitl/manifest.json
          git commit -m "chore(release): $VERSION"
          git push origin HEAD:main
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Read the version
        id: version
        env:
          RELEASED: ${{ needs.prepare.outputs.released }}
          RELEASED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ "$RELEASED" = "true" ]; then
            echo "version=$RELEASED_VERSION" >> "$GITHUB_OUTPUT"
            echo "backfill=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(jq -r .version .claude-plugin/plugin.json)" >> "$GITHUB_OUTPUT"
            echo "backfill=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag the version if it has no tag
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          commit=$(node scripts/release.mjs target --repo . --version "$VERSION" | jq -r .commit)
          git tag "v$VERSION" "$commit"
          git push origin "refs/tags/v$VERSION"
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: Create the GitHub Release if it is missing
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then exit 0; fi
          node scripts/release.mjs notes --repo . --version "$VERSION" | jq -r .notes > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
      - name: Catch up pull requests held back while this version had no tag
        if: ${{ !cancelled() && steps.tag.outputs.created == 'true' && steps.version.outputs.backfill == 'true' }}
        run: gh workflow run release.yml --ref main
